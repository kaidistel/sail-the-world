.PI/180),hh=7+camDist*Math.sin(-camPitch*Math.PI/180),lat=s.lat+Math.cos(wy)*flat/111320,lon=s.lon+Math.sin(wy)*flat/(111320*Math.cos(s.lat*Math.PI/180)),dest=Cesium.Cartesian3.fromDegrees(lon,lat,hh+s.heave),tar=Cesium.Cartesian3.fromDegrees(s.lon,s.lat,1.5+s.heave),dir=Cesium.Cartesian3.normalize(Cesium.Cartesian3.subtract(tar,dest,new Cesium.Cartesian3()),new Cesium.Cartesian3()),up=Cesium.Ellipsoid.WGS84.geodeticSurfaceNormal(dest,new Cesium.Cartesian3());v.camera.setView({destination:dest,orientation:{direction:dir,up}});return}let cfg=camMode===1?{f:3.0,r:0,z:8.05}:{f:camMode===2?-3.8:-10.7,r:camMode===2?-1.55:0,z:camMode===2?6.95:6.75},p=offset(cfg.f,cfg.r),lookH=(s.heading+camYaw)*Math.PI/180,lookP=camPitch*Math.PI/180,eye=Cesium.Cartesian3.fromDegrees(p.lon,p.lat,cfg.z+s.heave),far={lat:p.lat+Math.cos(lookH)*100/111320,lon:p.lon+Math.sin(lookH)*100/(111320*Math.cos(p.lat*Math.PI/180))},target=Cesium.Cartesian3.fromDegrees(far.lon,far.lat,cfg.z+s.heave+Math.tan(-lookP)*100),dir=Cesium.Cartesian3.normalize(Cesium.Cartesian3.subtract(target,eye,new Cesium.Cartesian3()),new Cesium.Cartesian3()),up=Cesium.Ellipsoid.WGS84.geodeticSurfaceNormal(eye,new Cesium.Cartesian3());v.camera.setView({destination:eye,orientation:{direction:dir,up}})}");h=h.replace("if(e.code==='KeyC'){camYaw=0;camPitch=-16;camDist=48}","if(e.code==='KeyC'){camYaw=0;camPitch=camMode?0:-16;camDist=48}if(e.code==='KeyV'){camMode=(camMode+1)%4;camYaw=0;camPitch=camMode?0:-16;toast('Kamera: '+camNames[camMode])}");h=h.replace("camPitch=Math.max(-65,Math.min(-3,camPitch+(e.clientY-ly)*.2))","camPitch=camMode?Math.max(-35,Math.min(35,camPitch+(e.clientY-ly)*.2)):Math.max(-65,Math.min(-3,camPitch+(e.clientY-ly)*.2))");h=h.replace("cv.onwheel=e=>{e.preventDefault();camDist=Math.max(20,Math.min(170,camDist+e.deltaY*.06))}","cv.onwheel=e=>{e.preventDefault();if(camMode===0)camDist=Math.max(20,Math.min(170,camDist+e.deltaY*.06))}");document.open();document.write(h);document.close()}catch(e){document.bod
