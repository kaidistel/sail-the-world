<title>Sail the World</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.118/Build/Cesium/Widgets/widgets.css">
<style>
html,body,#c{width:100%;height:100%;margin:0;overflow:hidden;background:#76aeca;font-family:system-ui,Arial}.cesium-viewer-bottom,.cesium-viewer-toolbar{display:none!important}
#hud{position:fixed;z-index:20;top:14px;left:14px;color:white;text-shadow:0 2px 7px #000}#hud h3{margin:0 0 8px;letter-spacing:.1em}.s{display:flex;gap:6px}.b{background:#071625dc;border:1px solid #ffffff28;border-radius:9px;padding:8px 10px;min-width:80px}.b strong{display:block;font-size:18px}.b small{font-size:8px;opacity:.7}.help{margin-top:7px;background:#071625c8;border-radius:8px;padding:7px 9px;font-size:11px}

#mwrap{position:fixed;inset:0;z-index:40;background:#08131d;display:none}#mh{height:50px;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:900}#map{position:absolute;top:50px;bottom:0;width:100%;height:calc(100% - 50px);background:#bed5dc;cursor:crosshair}
#toast{position:fixed;z-index:60;left:50%;bottom:22px;transform:translateX(-50%);background:#071625ed;color:white;border-radius:20px;padding:8px 13px;opacity:0;transition:.2s}#toast.on{opacity:1}
</style></head><body>
<div id="c"></div><div id="hud"><h3>SAIL THE WORLD · NASSAUHAFEN</h3><div class="s"><div class="b"><strong id="sp">0.0</strong><small>KNOTEN</small></div><div class="b"><strong id="hd">190</strong><small>KURS</small></div><div class="b"><strong id="th">0</strong><small>MASCHINE %</small></div><div class="b"><strong id="ro">0.0°</strong><small>ROLL</small></div></div><div class="help">W/S Maschine · A/D Ruder · G Anlegen · M OpenSeaMap · Rechtsklick = Teleport</div></div><div id="st">Lade ArcGIS …</div>
<div id="mwrap"><div id="mh">OPEN<span style="color:#5cc9ff">SEA</span>MAP <span style="font-size:10px;font-weight:500">M schließen · Rechtsklick teleportiert</span></div><canvas id="map"></canvas></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.118/Build/Cesium/Cesium.js"></script>
<script>
(async()=>{const START={lat:53.513611,lon:8.151944,heading:190},KN=.514444,MAX=20;const s={...START,speed:0,thr:0,rud:0,yaw:0,roll:0,pitch:0,heave:0,map:false,dock:false},keys=new Set(),$=x=>document.getElementById(x);function toast(t){$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('on'),1400)}
let v=new Cesium.Viewer('c',{baseLayer:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),animation:false,timeline:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,geocoder:false,baseLayerPicker:false,fullscreenButton:false,infoBox:false,selectionIndicator:false});v.scene.skyBox=undefined;v.scene.backgroundColor=new Cesium.Color(.45,.68,.82,1);v.scene.globe.baseColor=new Cesium.Color(.18,.34,.23,1);v.scene.globe.depthTestAgainstTerrain=true;v.scene.fog.enabled=true;v.scene.fog.density=.00007;v.scene.highDynamicRange=true;
v.camera.setView({destination:Cesium.Cartesian3.fromDegrees(8.1503,53.5127,70),orientation:{heading:Cesium.Math.toRadians(8),pitch:Cesium.Math.toRadians(-18),roll:0}});
try{let im=await Cesium.ArcGisMapServerImageryProvider.fromUrl('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer');v.imageryLayers.addImageryProvider(im);$('st').textContent='ArcGIS Bild ✓'}catch(e){$('st').textContent='ArcGIS Bild blockiert'}
try{v.terrainProvider=await Cesium.ArcGISTiledElevationTerrainProvider.fromUrl('https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer');$('st').textContent+=' · Terrain ✓'}catch(e){$('st').textContent+=' · Terrain Fallback'}
// guaranteed sea + water effect
v.entities.add({rectangle:{coordinates:Cesium.Rectangle.fromDegrees(3,50.5,10.7,57.8),height:.12,material:new Cesium.Color(.02,.29,.40,1)}});try{let mat=new Cesium.Material({fabric:{type:'Water',uniforms:{normalMap:Cesium.buildModuleUrl('Assets/Textures/waterNormals.jpg'),frequency:950,animationSpeed:.014,amplitude:6.5,specularIntensity:.95,baseWaterColor:new Cesium.Color(.015,.18,.25,.9),blendColor:new Cesium.Color(.03,.32,.40,.72)}}});v.scene.primitives.add(new Cesium.Primitive({geometryInstances:new Cesium.GeometryInstance({geometry:new Cesium.RectangleGeometry({rectangle:Cesium.Rectangle.fromDegrees(3,50.5,10.7,57.8),height:.28,vertexFormat:Cesium.EllipsoidSurfaceAppearance.VERTEX_FORMAT})}),appearance:new Cesium.EllipsoidSurfaceAppearance({aboveGround:true,material:mat})}))}catch(e){}
function off(f,r){let a=s.heading*Math.PI/180,n=f*Math.cos(a)-r*Math.sin(a),e=f*Math.sin(a)+r*Math.cos(a);return{lat:s.lat+n/111320,lon:s.lon+e/(111320*Math.cos(s.lat*Math.PI/180))}}function pos(f,r,u){let p=off(f,r);return Cesium.Cartesian3.fromDegrees(p.lon,p.lat,1.8+s.heave+u)}function ori(){return Cesium.Transforms.headingPitchRollQuaternion(Cesium.Cartesian3.fromDegrees(s.lon,s.lat,1.8+s.heave),new Cesium.HeadingPitchRoll(Cesium.Math.toRadians(s.heading),Cesium.Math.toRadians(s.pitch),Cesium.Math.toRadians(s.roll)))}function add(f,r,u,o){v.entities.add({position:new Cesium.CallbackProperty(()=>pos(f,r,u),false),orientation:new Cesium.CallbackProperty(()=>ori(),false),...o})}
let W=new Cesium.Color(.94,.96,.96,1),D=new Cesium.Color(.03,.10,.13,.96),R=new Cesium.Color(.68,.06,.05,1),Y=new Cesium.Color(.95,.7,.08,1);add(0,0,0,{ellipsoid:{radii:new Cesium.Cartesian3(34.3,5.2,3.7),material:W}});add(1,0,-1.7,{box:{dimensions:new Cesium.Cartesian3(56,10.6,.55),material:R}});add(-1,0,4.5,{box:{dimensions:new Cesium.Cartesian3(45,9.4,5.6),material:W}});add(-7,0,8.3,{box:{dimensions:new Cesium.Cartesian3(30,8.5,2.5),material:W}});add(11,0,8.2,{box:{dimensions:new Cesium.Cartesian3(10,8.8,3.1),material:new Cesium.Color(.76,.88,.93,1)}});add(-15,0,12.3,{cylinder:{length:5.5,topRadius:1.3,bottomRadius:1.7,material:new Cesium.Color(.1,.1,.11,1)}});add(7,0,14,{cylinder:{length:12,topRadius:.14,bottomRadius:.24,material:Y}});for(let r of [-4.74,4.74])add(4,r,7.8,{box:{dimensions:new Cesium.Cartesian3(34,.16,1.15),material:D}});for(let r of [-5.15,5.15])for(let f of [-8,3])add(f,r,6.7,{ellipsoid:{radii:new Cesium.Cartesian3(3.1,.65,.7),material:new Cesium.Color(.96,.42,.06,1)}});
const waves=[{a:.5,l:34,d:18,w:1.1},{a:.3,l:17,d:62,w:1.45},{a:.17,l:8.5,d:126,w:1.7}];function lm(){return{x:(s.lon-START.lon)*111320*Math.cos(START.lat*Math.PI/180),y:(s.lat-START.lat)*111320}}function wh(x,y,t){let h=0;for(let q of waves){let k=2*Math.PI/q.l,d=q.d*Math.PI/180;h+=q.a*Math.sin(k*(x*Math.sin(d)+y*Math.cos(d))-q.w*t)}return h}
function phy(dt,t){if(s.map)return;if(s.dock){s.speed*=Math.exp(-8*dt);return}if(keys.has('KeyW'))s.thr=Math.min(1,s.thr+dt*.11);if(keys.has('KeyS'))s.thr=Math.max(-.18,s.thr-dt*.15);let ri=(keys.has('KeyA')?-1:0)+(keys.has('KeyD')?1:0);s.rud+=(ri-s.rud)*Math.min(1,dt*1.5);let target=s.thr>=0?s.thr*MAX*KN:s.thr*5;s.speed+=(target-s.speed)*Math.min(1,dt/(target>s.speed?23:35));let auth=Math.min(1,Math.abs(s.speed)/(7*KN)),ty=s.rud*auth*(1.15*Math.PI/180);s.yaw+=(ty-s.yaw)*Math.min(1,dt/6);s.heading=(s.heading+s.yaw*180/Math.PI*dt+360)%360;let a=s.heading*Math.PI/180;s.lat+=Math.cos(a)*s.speed*dt/111320;s.lon+=Math.sin(a)*s.speed*dt/(111320*Math.cos(s.lat*Math.PI/180));let p=lm(),h=wh(p.x,p.y,t);s.heave+=(h-s.heave)*Math.min(1,dt*1.2);s.roll+=((-s.rud*Math.min(1,Math.abs(s.speed)/(12*KN))*3)-s.roll)*Math.min(1,dt*.7);s.pitch+=(Math.sin(t*.75)*.7-s.pitch)*Math.min(1,dt*.6)}
function cam(){if(s.map)return;let a=s.heading*Math.PI/180,b=120,lat=s.lat-Math.cos(a)*b/111320,lon=s.lon-Math.sin(a)*b/(111320*Math.cos(s.lat*Math.PI/180));v.camera.setView({destination:Cesium.Cartesian3.fromDegrees(lon,lat,45+s.heave),orientation:{heading:Cesium.Math.toRadians(s.heading),pitch:Cesium.Math.toRadians(-15),roll:0}})}function hud(){$('sp').textContent=(Math.abs(s.speed)/KN).toFixed(1);$('hd').textContent=String(Math.round(s.heading)).padStart(3,'0');$('th').textContent=Math.round(s.thr*100);$('ro').textContent=s.roll.toFixed(1)+'°'}
function dock(){let p=lm();if(s.dock){s.dock=false;toast('Abgelegt');return}if(Math.hypot(p.x,p.y)>110)return toast('Kein Anleger in Reichweite');if(Math.abs(s.speed)/KN>2.5)return toast('Unter 2,5 kn abbremsen');Object.assign(s,{lat:START.lat,lon:START.lon,heading:190,speed:0,thr:0,rud:0,yaw:0,dock:true});toast('Angelegt')}
// map
let mw=$('mwrap'),mc=$('map'),x=mc.getContext('2d'),z=15,cen={lat:START.lat,lon:START.lon},cache=new Map();function lx(l,z){return(l+180)/360*2**z}function ly(a,z){let r=a*Math.PI/180;return(1-Math.asinh(Math.tan(r))/Math.PI)/2*2**z}function xl(q,z){return q/2**z*360-180}function yl(q,z){let n=Math.PI-2*Math.PI*q/2**z;return 180/Math.PI*Math.atan(Math.sinh(n))}function ti(u,k){if(cache.has(k))return cache.get(k);let i=new Image(),r={i,ok:false};cache.set(k,r);i.onload=()=>{r.ok=true;dm()};i.src=u;return r}function layer(base,z,cx,cy,w,h){for(let j=-4;j<=4;j++)for(let i=-6;i<=6;i++){let tx=Math.floor(cx)+i,ty=Math.floor(cy)+j,n=2**z;if(ty<0||ty>=n)continue;tx=(tx%n+n)%n;let px=w/2+(Math.floor(cx)+i-cx)*256,py=h/2+(Math.floor(cy)+j-cy)*256,u=base.replace('{z}',z).replace('{x}',tx).replace('{y}',ty),r=ti(u,base+z+'/'+tx+'/'+ty);if(r.ok)x.drawImage(r.i,px,py,256,256)}}function rm(){let d=Math.min(devicePixelRatio||1,2),r=mc.getBoundingClientRect();mc.width=r.width*d;mc.height=r.height*d;x.setTransform(d,0,0,d,0,0);dm()}function dm(){if(!s.map)return;let r=mc.getBoundingClientRect(),w=r.width,h=r.height,cx=lx(cen.lon,z),cy=ly(cen.lat,z);x.fillStyle='#bdd3dc';x.fillRect(0,0,w,h);layer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',z,cx,cy,w,h);layer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',z,cx,cy,w,h);let bx=(lx(s.lon,z)-cx)*256+w/2,by=(ly(s.lat,z)-cy)*256+h/2;x.fillStyle='#ffe65f';x.beginPath();x.arc(bx,by,7,0,7);x.fill()}function tm(){s.map=!s.map;mw.style.display=s.map?'block':'none';if(s.map){cen={lat:s.lat,lon:s.lon};setTimeout(rm,0)}}mc.addEventListener('contextmenu',e=>{e.preventDefault();let r=mc.getBoundingClientRect(),cx=lx(cen.lon,z),cy=ly(cen.lat,z),tx=cx+(e.clientX-r.left-r.width/2)/256,ty=cy+(e.clientY-r.top-r.height/2)/256;s.lon=xl(tx,z);s.lat=yl(ty,z);s.speed=0;s.thr=0;s.dock=false;cen={lat:s.lat,lon:s.lon};dm();toast('Teleportiert')});mc.addEventListener('wheel',e=>{e.preventDefault();z=Math.max(4,Math.min(18,z+(e.deltaY<0?1:-1)));dm()},{passive:false});
addEventListener('keydown',e=>{if(['KeyW','KeyA','KeyS','KeyD'].includes(e.code)){keys.add(e.code);e.preventDefault()}if(e.code==='KeyG'&&!e.repeat)dock();if(e.code==='KeyM'&&!e.repeat)tm()});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('resize',()=>s.map&&rm());let last=performance.now();v.scene.preRender.addEventListener(()=>{let n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;phy(dt,n/1000);cam();hud()});cam();})();
</script></body></html>
