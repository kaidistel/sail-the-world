<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sail the World</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.118/Build/Cesium/Widgets/widgets.css"><style>*{box-sizing:border-box}html,body,#c{width:100%;height:100%;margin:0;overflow:hidden;background:#78afcc;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.cesium-viewer-bottom,.cesium-viewer-toolbar{display:none!important}#hud{position:fixed;z-index:20;left:14px;top:14px;color:#fff;text-shadow:0 2px 8px #000;pointer-events:none}.stats{display:flex;gap:6px}.card{min-width:84px;padding:8px 10px;border-radius:9px;background:#071625dc}.card b{display:block;font-size:18px}.card small{font-size:8px}.help{margin-top:7px;padding:7px 9px;border-radius:8px;background:#071625c8;font-size:11px}#miniBox{position:fixed;z-index:24;right:14px;top:14px;width:300px;height:215px;background:#071625e8;border:1px solid #ffffff2d;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px #0007}#miniHead{height:30px;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 9px;font-size:9px;font-weight:900;letter-spacing:.08em}#mini{width:100%;height:185px;display:block;background:#bdd3dc}#sim{position:fixed;z-index:23;right:14px;bottom:14px;width:230px;color:#fff;background:#071625e8;border-radius:12px;padding:10px}.simRow{display:flex;justify-content:space-between;font-size:9px}#sea{width:100%;accent-color:#62cfff}#mwrap{position:fixed;inset:0;z-index:40;background:#08131d;display:none}#mh{height:50px;color:#fff;padding:15px;font-weight:900}#map{position:absolute;top:50px;bottom:0;width:100%;height:calc(100% - 50px);background:#bdd3dc}#toast{position:fixed;z-index:60;left:50%;bottom:22px;transform:translateX(-50%);background:#071625ed;color:#fff;border-radius:20px;padding:8px 13px;opacity:0;transition:.2s}#toast.on{opacity:1}@media(max-width:900px){#miniBox{width:240px;height:180px}#mini{height:150px}}</style></head><body><div id="c"></div><div id="hud"><h3>SAIL THE WORLD · DEUTSCHE BUCHT</h3><div class="stats"><div class="card"><b id="sp">0.0</b><small>KNOTEN</small></div><div class="card"><b id="hd">190</b><small>KURS</small></div><div class="card"><b id="th">0</b><small>MASCHINE %</small></div><div class="card"><b id="ro">0.0°</b><small>ROLL</small></div></div><div class="help">W/S Gas · A/D Lenken · G Anlegen · M große Karte · Maus ziehen = umsehen · Mausrad = Zoom</div></div><div id="miniBox"><div id="miniHead"><span>OPEN<span style="color:#5cc9ff">SEA</span>MAP · NAV</span><span id="nearest">—</span></div><canvas id="mini"></canvas></div><div id="sim"><div class="simRow"><span>SEEGANG</span><span id="seaTxt">2 · leicht</span></div><input id="sea" type="range" min="0" max="5" value="2"></div><div id="mwrap"><div id="mh">OPEN<span style="color:#5cc9ff">SEA</span>MAP · M schließen · Rechtsklick = Teleport</div><canvas id="map"></canvas></div><div id="toast"></div><script src="https://cdn.jsdelivr.net/npm/cesium@1.118/Build/Cesium/Cesium.js"></script><script src="harbors.js"></script><script>(async()=>{const START={lat:53.513611,lon:8.151944,heading:190},KN=.514444,MAX=34,H=window.SAIL_HARBORS||[];const s={...START,speed:0,thr:0,rud:0,roll:0,pitch:0,heave:0,map:false,dock:false,sea:2};const keys=new Set(),$=x=>document.getElementById(x);let camYaw=0,camPitch=-16,camDist=45,drag=false,lx=0,ly=0;function toast(t){$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('on'),1600)}let v=new Cesium.Viewer('c',{baseLayer:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),animation:false,timeline:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,geocoder:false,baseLayerPicker:false,fullscreenButton:false,infoBox:false,selectionIndicator:false});v.scene.skyBox=undefined;v.scene.backgroundColor=new Cesium.Color(.47,.70,.84,1);v.scene.globe.baseColor=new Cesium.Color(.18,.34,.23,1);v.scene.globe.depthTestAgainstTerrain=true;v.scene.fog.enabled=true;v.scene.screenSpaceCameraController.enableRotate=false;v.scene.screenSpaceCameraController.enableTranslate=false;v.scene.screenSpaceCameraController.enableZoom=false;v.scene.screenSpaceCameraController.enableTilt=false;v.scene.screenSpaceCameraController.enableLook=false;try{v.imageryLayers.addImageryProvider(await Cesium.ArcGisMapServerImageryProvider.fromUrl('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer'))}catch(e){}try{v.terrainProvider=await Cesium.ArcGISTiledElevationTerrainProvider.fromUrl('https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer')}catch(e){}v.entities.add({rectangle:{coordinates:Cesium.Rectangle.fromDegrees(3,50.5,10.7,57.8),height:.04,material:new Cesium.Color(.01,.20,.29,1)}});let waterMat=null;try{waterMat=new Cesium.Material({fabric:{type:'Water',uniforms:{normalMap:Cesium.buildModuleUrl('Assets/Textures/waterNormals.jpg'),frequency:520,animationSpeed:.018,amplitude:5.5,specularIntensity:1,baseWaterColor:new Cesium.Color(.01,.16,.23,.94),blendColor:new Cesium.Color(.02,.34,.44,.72)}}});v.scene.primitives.add(new Cesium.Primitive({geometryInstances:new Cesium.GeometryInstance({geometry:new Cesium.RectangleGeometry({rectangle:Cesium.Rectangle.fromDegrees(3,50.5,10.7,57.8),height:.12,vertexFormat:Cesium.EllipsoidSurfaceAppearance.VERTEX_FORMAT})}),appearance:new Cesium.EllipsoidSurfaceAppearance({aboveGround:true,material:waterMat})}))}catch(e){}function off(f,r){let a=s.heading*Math.PI/180;return{lat:s.lat+(f*Math.cos(a)-r*Math.sin(a))/111320,lon:s.lon+(f*Math.sin(a)+r*Math.cos(a))/(111320*Math.cos(s.lat*Math.PI/180))}}function pos(){return Cesium.Cartesian3.fromDegrees(s.lon,s.lat,.85+s.heave)}function ori(){let q=Cesium.Transforms.headingPitchRollQuaternion(pos(),new Cesium.HeadingPitchRoll(Cesium.Math.toRadians(s.heading-90),Cesium.Math.toRadians(s.pitch),Cesium.Math.toRadians(s.roll)));let fix=Cesium.Quaternion.fromAxisAngle(Cesium.Cartesian3.UNIT_X,-Cesium.Math.PI_OVER_TWO,new Cesium.Quaternion());return Cesium.Quaternion.multiply(q,fix,new Cesium.Quaternion())}v.entities.add({position:new Cesium.CallbackProperty(pos,false),orientation:new Cesium.CallbackProperty(ori,false),model:{uri:'boat.gltf',scale:1,minimumPixelSize:48,maximumScale:2.5,runAnimations:false}});H.forEach(h=>v.entities.add({position:Cesium.Cartesian3.fromDegrees(h.lon,h.lat,2),point:{pixelSize:8,color:Cesium.Color.YELLOW,outlineColor:Cesium.Color.BLACK,outlineWidth:2},label:{text:h.name,font:'11px sans-serif',pixelOffset:new Cesium.Cartesian2(0,-15),fillColor:Cesium.Color.WHITE,outlineColor:Cesium.Color.BLACK,outlineWidth:3,style:Cesium.LabelStyle.FILL_AND_OUTLINE,distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,16000)}}));const waves=[{a:.52,l:34,d:18,w:1.15},{a:.34,l:18,d:58,w:1.55},{a:.18,l:8.5,d:122,w:2.05}],sc=[.02,.35,.68,1,1.4,1.9];function wh(x,y,t){let h=0;for(let q of waves){let k=2*Math.PI/q.l,d=q.d*Math.PI/180;h+=q.a*sc[s.sea]*Math.sin(k*(x*Math.sin(d)+y*Math.cos(d))-q.w*t)}return h}function dist(h){let dy=(s.lat-h.lat)*111320,dx=(s.lon-h.lon)*111320*Math.cos(s.lat*Math.PI/180);return Math.hypot(dx,dy)}function nearest(){if(!H.length)return null;return H.reduce((a,b)=>dist(a)<dist(b)?a:b)}function dock(){if(s.dock){s.dock=false;toast('Abgelegt');return}let h=nearest(),d=dist(h);if(d>450)return toast('Kein Hafen in Reichweite · '+h.name+' '+(d/1852).toFixed(1)+' sm');if(Math.abs(s.speed)/KN>4)return toast('Unter 4 kn abbremsen');Object.assign(s,{lat:h.lat,lon:h.lon,heading:h.heading||0,speed:0,thr:0,rud:0,dock:true});toast('Angelegt: '+h.name)}function phy(dt,t){if(s.map)return;if(s.dock){s.speed=0;return}if(keys.has('KeyW'))s.thr=Math.min(1,s.thr+dt*.65);if(keys.has('KeyS'))s.thr=Math.max(-.3,s.thr-dt*.75);let ri=(keys.has('KeyA')?-1:0)+(keys.has('KeyD')?1:0);s.rud+=(ri-s.rud)*Math.min(1,dt*7);let target=s.thr>=0?s.thr*MAX*KN:s.thr*8;s.speed+=(target-s.speed)*Math.min(1,dt/3);s.heading=(s.heading+s.rud*Math.min(1,Math.abs(s.speed)/(2*KN))*8*dt+360)%360;let a=s.heading*Math.PI/180;s.lat+=Math.cos(a)*s.speed*dt/111320;s.lon+=Math.sin(a)*s.speed*dt/(111320*Math.cos(s.lat*Math.PI/180));let x=(s.lon-START.lon)*111320*Math.cos(START.lat*Math.PI/180),y=(s.lat-START.lat)*111320,b=wh(x+5*Math.sin(a),y+5*Math.cos(a),t),st=wh(x-5*Math.sin(a),y-5*Math.cos(a),t),p=wh(x-2*Math.cos(a),y+2*Math.sin(a),t),r=wh(x+2*Math.cos(a),y-2*Math.sin(a),t),m=wh(x,y,t);s.heave+=(m-s.heave)*Math.min(1,dt*2.5);s.pitch+=(Math.atan2(b-st,10)*180/Math.PI-s.pitch)*Math.min(1,dt*2);s.roll+=(Math.atan2(r-p,4)*180/Math.PI-s.roll)*Math.min(1,dt*2)}function cam(){if(s.map)return;let wy=(s.heading+180+camYaw)*Math.PI/180,flat=camDist*Math.cos(camPitch*Math.PI/180),h=6+camDist*Math.sin(-camPitch*Math.PI/180),lat=s.lat+Math.cos(wy)*flat/111320,lon=s.lon+Math.sin(wy)*flat/(111320*Math.cos(s.lat*Math.PI/180)),dest=Cesium.Cartesian3.fromDegrees(lon,lat,h+s.heave),target=Cesium.Cartesian3.fromDegrees(s.lon,s.lat,1.5+s.heave),dir=Cesium.Cartesian3.normalize(Cesium.Cartesian3.subtract(target,dest,new Cesium.Cartesian3()),new Cesium.Cartesian3()),up=Cesium.Ellipsoid.WGS84.geodeticSurfaceNormal(dest,new Cesium.Cartesian3());v.camera.setView({destination:dest,orientation:{direction:dir,up}})}function hud(){$('sp').textContent=(Math.abs(s.speed)/KN).toFixed(1);$('hd').textContent=String(Math.round(s.heading)).padStart(3,'0');$('th').textContent=Math.round(s.thr*100);$('ro').textContent=s.roll.toFixed(1)+'°';let h=nearest();if(h)$('nearest').textContent=h.name+' '+(dist(h)/1852).toFixed(1)+' sm'}const cv=v.canvas;cv.onpointerdown=e=>{if(e.button!==0)return;drag=true;lx=e.clientX;ly=e.clientY};cv.onpointermove=e=>{if(!drag)return;camYaw-=(e.clientX-lx)*.28;camPitch=Math.max(-65,Math.min(-3,camPitch+(e.clientY-ly)*.2));lx=e.clientX;ly=e.clientY};cv.onpointerup=()=>drag=false;cv.onwheel=e=>{e.preventDefault();camDist=Math.max(18,Math.min(150,camDist+e.deltaY*.06))};$('sea').oninput=e=>{s.sea=+e.target.value;$('seaTxt').textContent=s.sea+' · '+['glatt','ruhig','leicht','mäßig','rau','schwer'][s.sea];if(waterMat){waterMat.uniforms.amplitude=2.5+s.sea*2.2;waterMat.uniforms.frequency=700-s.sea*70}};const cache=new Map();function mercX(l,z){return(l+180)/360*2**z}function mercY(a,z){let r=a*Math.PI/180;return(1-Math.asinh(Math.tan(r))/Math.PI)/2*2**z}function lonFromX(x,z){return x/2**z*360-180}function latFromY(y,z){return 180/Math.PI*Math.atan(Math.sinh(Math.PI-2*Math.PI*y/2**z))}function tile(url,key,cb){if(cache.has(key))return cache.get(key);let im=new Image(),o={im,ok:false};cache.set(key,o);im.onload=()=>{o.ok=true;cb&&cb()};im.src=url;return o}function drawTiles(ctx,w,h,lat,lon,z,cb){let cx=mercX(lon,z),cy=mercY(lat,z);ctx.fillStyle='#bdd3dc';ctx.fillRect(0,0,w,h);for(let base of ['https://tile.openstreetmap.org/{z}/{x}/{y}.png','https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png'])for(let j=-3;j<=3;j++)for(let i=-3;i<=3;i++){let tx=Math.floor(cx)+i,ty=Math.floor(cy)+j,n=2**z;if(ty<0||ty>=n)continue;tx=(tx%n+n)%n;let u=base.replace('{z}',z).replace('{x}',tx).replace('{y}',ty),o=tile(u,base+z+'/'+tx+'/'+ty,cb);if(o.ok)ctx.drawImage(o.im,w/2+(Math.floor(cx)+i-cx)*256,h/2+(Math.floor(cy)+j-cy)*256,256,256)}return{cx,cy}}function drawMarkers(ctx,w,h,cx,cy,z,labels){H.forEach(q=>{let x=(mercX(q.lon,z)-cx)*256+w/2,y=(mercY(q.lat,z)-cy)*256+h/2;if(x<-10||x>w+10||y<-10||y>h+10)return;ctx.fillStyle='#ffd84d';ctx.strokeStyle='#10202d';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();ctx.stroke();if(labels){ctx.fillStyle='#10202d';ctx.font='10px sans-serif';ctx.fillText(q.name,x+7,y+3)}});ctx.save();ctx.translate(w/2,h/2);ctx.rotate(s.heading*Math.PI/180);ctx.fillStyle='#ff334a';ctx.strokeStyle='white';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(7,8);ctx.lineTo(0,5);ctx.lineTo(-7,8);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}const mini=$('mini'),mctx=mini.getContext('2d');function resizeMini(){let r=mini.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);mini.width=r.width*d;mini.height=r.height*d;mctx.setTransform(d,0,0,d,0,0);drawMini()}function drawMini(){let r=mini.getBoundingClientRect(),w=r.width,h=r.height,z=12,c=drawTiles(mctx,w,h,s.lat,s.lon,z,drawMini);drawMarkers(mctx,w,h,c.cx,c.cy,z,false)}let mw=$('mwrap'),mc=$('map'),ctx=mc.getContext('2d'),z=10,cen={lat:s.lat,lon:s.lon};function resizeMap(){let r=mc.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);mc.width=r.width*d;mc.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);drawMap()}function drawMap(){if(!s.map)return;let r=mc.getBoundingClientRect(),w=r.width,h=r.height,c=drawTiles(ctx,w,h,cen.lat,cen.lon,z,drawMap);drawMarkers(ctx,w,h,c.cx,c.cy,z,true)}function tm(){s.map=!s.map;mw.style.display=s.map?'block':'none';if(s.map){cen={lat:s.lat,lon:s.lon};setTimeout(resizeMap,0)}}mc.oncontextmenu=e=>{e.preventDefault();let r=mc.getBoundingClientRect(),cx=mercX(cen.lon,z),cy=mercY(cen.lat,z);s.lon=lonFromX(cx+(e.clientX-r.left-r.width/2)/256,z);s.lat=latFromY(cy+(e.clientY-r.top-r.height/2)/256,z);s.speed=s.thr=0;s.dock=false;cen={lat:s.lat,lon:s.lon};drawMap();toast('Teleportiert')};mc.onwheel=e=>{e.preventDefault();z=Math.max(4,Math.min(18,z+(e.deltaY<0?1:-1)));drawMap()};addEventListener('keydown',e=>{if(['KeyW','KeyA','KeyS','KeyD'].includes(e.code)){keys.add(e.code);e.preventDefault()}if(e.code==='KeyG'&&!e.repeat)dock();if(e.code==='KeyM'&&!e.repeat)tm()});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('resize',()=>{resizeMini();if(s.map)resizeMap()});resizeMini();let last=performance.now(),lastMini=0;v.scene.preRender.addEventListener(()=>{let n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;phy(dt,n/1000);cam();hud();if(n-lastMini>450){lastMini=n;drawMini()}});cam()})();</script></body></html>
