<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sail the World</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.118/Build/Cesium/Widgets/widgets.css">
<style>
*{box-sizing:border-box}html,body,#c{width:100%;height:100%;margin:0;overflow:hidden;background:#78afcc;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.cesium-viewer-bottom,.cesium-viewer-toolbar{display:none!important}
#hud{position:fixed;z-index:20;left:14px;top:14px;color:#fff;text-shadow:0 2px 8px #000;pointer-events:none}#hud h3{margin:0 0 8px;letter-spacing:.1em}.stats{display:flex;gap:6px}.card{min-width:84px;padding:8px 10px;border-radius:9px;background:#071625dc;border:1px solid #ffffff28}.card strong{display:block;font-size:18px}.card small{font-size:8px;opacity:.7}.help{margin-top:7px;padding:7px 9px;border-radius:8px;background:#071625c8;font-size:11px}
#st{position:fixed;z-index:21;right:14px;top:14px;color:#fff;background:#071625df;border:1px solid #ffffff28;border-radius:9px;padding:8px 10px;font-size:10px}
#sim{position:fixed;z-index:23;right:14px;bottom:14px;width:230px;color:#fff;background:#071625e8;border:1px solid #ffffff28;border-radius:12px;padding:10px}.simTitle{font-size:10px;font-weight:900;letter-spacing:.11em;margin-bottom:7px}.simRow{display:flex;justify-content:space-between;font-size:9px;margin-bottom:4px}#sea{width:100%;accent-color:#62cfff}#sim button{width:100%;margin-top:7px;border:1px solid #ffffff25;border-radius:8px;background:#143249;color:white;padding:7px;font-weight:800;cursor:pointer}
#mwrap{position:fixed;inset:0;z-index:40;background:#08131d;display:none}#mh{height:50px;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:900}#map{position:absolute;top:50px;bottom:0;width:100%;height:calc(100% - 50px);background:#bed5dc;cursor:crosshair}
#toast{position:fixed;z-index:60;left:50%;bottom:22px;transform:translateX(-50%);background:#071625ed;color:#fff;border-radius:20px;padding:8px 13px;opacity:0;transition:.2s}#toast.on{opacity:1}
</style></head>
<body>
<div id="c"></div>
<div id="hud"><h3>SAIL THE WORLD · NASSAUHAFEN</h3><div class="stats"><div class="card"><strong id="sp">0.0</strong><small>KNOTEN</small></div><div class="card"><strong id="hd">190</strong><small>KURS</small></div><div class="card"><strong id="th">0</strong><small>MASCHINE %</small></div><div class="card"><strong id="ro">0.0°</strong><small>ROLL</small></div></div><div class="help">W/S Gas · A/D Lenken · G Anlegen · M OpenSeaMap · Maus ziehen = umsehen · Mausrad = Zoom · C = Kamera zentrieren</div></div>
<div id="st">Lade ArcGIS …</div>
<div id="sim"><div class="simTitle">MEER & KAMERA</div><div class="simRow"><span>SEEGANG</span><span id="seaTxt">2 · leicht</span></div><input id="sea" type="range" min="0" max="5" step="1" value="2"><button id="center">KAMERA ZENTRIEREN</button></div>
<div id="mwrap"><div id="mh">OPEN<span style="color:#5cc9ff">SEA</span>MAP <span style="font-size:10px;font-weight:500">M schließen · Rechtsklick teleportiert</span></div><canvas id="map"></canvas></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.118/Build/Cesium/Cesium.js"></script>
<script>
(async()=>{
const START={lat:53.513611,lon:8.151944,heading:190},KN=.514444,MAX=34;
const s={...START,speed:0,thr:0,rud:0,yaw:0,roll:0,pitch:0,heave:0,map:false,dock:false,sea:2};
const keys=new Set(),$=id=>document.getElementById(id);let camYaw=0,camPitch=-16,camDist=45,drag=false,lastX=0,lastY=0;
function toast(t){$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('on'),1300)}
let v=new Cesium.Viewer('c',{baseLayer:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),animation:false,timeline:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,geocoder:false,baseLayerPicker:false,fullscreenButton:false,infoBox:false,selectionIndicator:false});
v.scene.skyBox=undefined;v.scene.backgroundColor=new Cesium.Color(.47,.70,.84,1);v.scene.globe.baseColor=new Cesium.Color(.18,.34,.23,1);v.scene.globe.depthTestAgainstTerrain=true;v.scene.fog.enabled=true;v.scene.fog.density=.00005;v.scene.highDynamicRange=true;v.scene.screenSpaceCameraController.enableRotate=false;v.scene.screenSpaceCameraController.enableTranslate=false;v.scene.screenSpaceCameraController.enableZoom=false;v.scene.screenSpaceCameraController.enableTilt=false;v.scene.screenSpaceCameraController.enableLook=false;
try{let im=await Cesium.ArcGisMapServerImageryProvider.fromUrl('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer');v.imageryLayers.addImageryProvider(im);$('st').textContent='ArcGIS Bild ✓'}catch(e){$('st').textContent='ArcGIS Bild blockiert'}
try{v.terrainProvider=await Cesium.ArcGISTiledElevationTerrainProvider.fromUrl('https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer');$('st').textContent+=' · Terrain ✓'}catch(e){$('st').textContent+=' · Terrain Fallback'}
v.entities.add({rectangle:{coordinates:Cesium.Rectangle.fromDegrees(3,50.5,10.7,57.8),height:.04,material:new Cesium.Color(.01,.20,.29,1)}});
let waterMat=null;try{waterMat=new Cesium.Material({fabric:{type:'Water',uniforms:{normalMap:Cesium.buildModuleUrl('Assets/Textures/waterNormals.jpg'),frequency:520,animationSpeed:.018,amplitude:5.5,specularIntensity:1.0,fadeFactor:1,baseWaterColor:new Cesium.Color(.01,.16,.23,.94),blendColor:new Cesium.Color(.02,.34,.44,.72)}}});v.scene.primitives.add(new Cesium.Primitive({geometryInstances:new Cesium.GeometryInstance({geometry:new Cesium.RectangleGeometry({rectangle:Cesium.Rectangle.fromDegrees(3,50.5,10.7,57.8),height:.12,vertexFormat:Cesium.EllipsoidSurfaceAppearance.VERTEX_FORMAT})}),appearance:new Cesium.EllipsoidSurfaceAppearance({aboveGround:true,material:waterMat})}))}catch(e){}
function off(f,r){let a=s.heading*Math.PI/180,n=f*Math.cos(a)-r*Math.sin(a),e=f*Math.sin(a)+r*Math.cos(a);return{lat:s.lat+n/111320,lon:s.lon+e/(111320*Math.cos(s.lat*Math.PI/180))}}
function boatPos(){return Cesium.Cartesian3.fromDegrees(s.lon,s.lat,.85+s.heave)}function boatOri(){return Cesium.Transforms.headingPitchRollQuaternion(boatPos(),new Cesium.HeadingPitchRoll(Cesium.Math.toRadians(s.heading-90),Cesium.Math.toRadians(s.pitch),Cesium.Math.toRadians(s.roll)))}
v.entities.add({position:new Cesium.CallbackProperty(boatPos,false),orientation:new Cesium.CallbackProperty(boatOri,false),model:{uri:'boat.gltf',scale:1.0,minimumPixelSize:48,maximumScale:2.5,runAnimations:false}});
const baseW=[{a:.52,l:34,d:18,w:1.15},{a:.34,l:18,d:58,w:1.55},{a:.18,l:8.5,d:122,w:2.05},{a:.08,l:3.8,d:205,w:2.9}],scales=[.02,.35,.68,1,1.4,1.9];
function lm(){return{x:(s.lon-START.lon)*111320*Math.cos(START.lat*Math.PI/180),y:(s.lat-START.lat)*111320}}function wh(x,y,t){let h=0,sc=scales[s.sea];for(let q of baseW){let k=2*Math.PI/q.l,d=q.d*Math.PI/180;h+=q.a*sc*Math.sin(k*(x*Math.sin(d)+y*Math.cos(d))-q.w*t)}return h}
const caps=[];for(let i=0;i<24;i++){const mat=new Cesium.ColorMaterialProperty(new Cesium.Color(1,1,1,.03));let e=v.entities.add({position:new Cesium.CallbackProperty(()=>{let t=performance.now()/1000,a=i*2.33+t*.025,rad=35+(i%8)*13,f=Math.cos(a)*rad,r=Math.sin(a)*rad,p=off(f,r),m=lm(),h=wh(m.x+f,m.y+r,t);return Cesium.Cartesian3.fromDegrees(p.lon,p.lat,.24+Math.max(0,h*.35))},false),ellipse:{semiMajorAxis:1.8+(i%4)*.7,semiMinorAxis:.16+(i%3)*.12,height:.25,material:mat}});caps.push(mat)}
const wake=[];for(let i=0;i<28;i++){const mat=new Cesium.ColorMaterialProperty(new Cesium.Color(1,1,1,0));let e=v.entities.add({position:new Cesium.CallbackProperty(()=>{let age=(performance.now()/1000+i*.18)%6,f=-6-age*(3+Math.abs(s.speed)*.9),r=(i%2?1:-1)*(1+age*.72),p=off(f,r);return Cesium.Cartesian3.fromDegrees(p.lon,p.lat,.25)},false),ellipse:{semiMajorAxis:2.2+(i%4)*.7,semiMinorAxis:.28+(i%3)*.15,height:.26,material:mat}});wake.push(mat)}
function phy(dt,t){if(s.map)return;if(s.dock){s.speed*=Math.exp(-9*dt);return}if(keys.has('KeyW'))s.thr=Math.min(1,s.thr+dt*.65);if(keys.has('KeyS'))s.thr=Math.max(-.3,s.thr-dt*.75);let ri=(keys.has('KeyA')?-1:0)+(keys.has('KeyD')?1:0);s.rud+=(ri-s.rud)*Math.min(1,dt*7.5);let target=s.thr>=0?s.thr*MAX*KN:s.thr*8;s.speed+=(target-s.speed)*Math.min(1,dt/(target>s.speed?2.6:4));let auth=Math.min(1,Math.abs(s.speed)/(1.8*KN)),ty=s.rud*auth*(7*Math.PI/180);s.yaw+=(ty-s.yaw)*Math.min(1,dt/.72);s.heading=(s.heading+s.yaw*180/Math.PI*dt+360)%360;let a=s.heading*Math.PI/180;s.lat+=Math.cos(a)*s.speed*dt/111320;s.lon+=Math.sin(a)*s.speed*dt/(111320*Math.cos(s.lat*Math.PI/180));let p=lm(),fx=Math.sin(a),fy=Math.cos(a),rx=Math.cos(a),ry=-Math.sin(a),sample=(f,r)=>wh(p.x+fx*f+rx*r,p.y+fy*f+ry*r,t),bow=sample(5.8,0),stern=sample(-5.8,0),port=sample(0,-1.7),star=sample(0,1.7),mid=sample(0,0);s.heave+=(mid-s.heave)*Math.min(1,dt*2.6);let pt=Math.atan2(bow-stern,11.6)*180/Math.PI,rt=Math.atan2(star-port,3.4)*180/Math.PI-s.rud*Math.min(1,Math.abs(s.speed)/(12*KN))*7;s.pitch+=(pt-s.pitch)*Math.min(1,dt*2.1);s.roll+=(Math.max(-14,Math.min(14,rt))-s.roll)*Math.min(1,dt*2)}
function cam(){if(s.map)return;let wy=(s.heading+180+camYaw)*Math.PI/180,flat=camDist*Math.cos(camPitch*Math.PI/180),h=6+camDist*Math.sin(-camPitch*Math.PI/180),n=Math.cos(wy)*flat,e=Math.sin(wy)*flat,lat=s.lat+n/111320,lon=s.lon+e/(111320*Math.cos(s.lat*Math.PI/180)),dest=Cesium.Cartesian3.fromDegrees(lon,lat,h+s.heave),target=Cesium.Cartesian3.fromDegrees(s.lon,s.lat,1.5+s.heave),dir=Cesium.Cartesian3.normalize(Cesium.Cartesian3.subtract(target,dest,new Cesium.Cartesian3()),new Cesium.Cartesian3()),up=Cesium.Ellipsoid.WGS84.geodeticSurfaceNormal(dest,new Cesium.Cartesian3());v.camera.setView({destination:dest,orientation:{direction:dir,up}})}
function hud(){$('sp').textContent=(Math.abs(s.speed)/KN).toFixed(1);$('hd').textContent=String(Math.round(s.heading)).padStart(3,'0');$('th').textContent=Math.round(s.thr*100);$('ro').textContent=s.roll.toFixed(1)+'°';let wa=Math.min(.46,Math.abs(s.speed)/(MAX*KN)*.46);wake.forEach((m,i)=>m.color.setValue(new Cesium.Color(1,1,1,wa*(.5+(i%3)*.12))));let ca=s.sea<3?.01:Math.min(.15,.035*(s.sea-1));caps.forEach(m=>m.color.setValue(new Cesium.Color(1,1,1,ca)))}
function dock(){let p=lm();if(s.dock){s.dock=false;toast('Abgelegt');return}if(Math.hypot(p.x,p.y)>110)return toast('Kein Anleger in Reichweite');if(Math.abs(s.speed)/KN>3)return toast('Unter 3 kn abbremsen');Object.assign(s,{lat:START.lat,lon:START.lon,heading:190,speed:0,thr:0,rud:0,yaw:0,dock:true});toast('Angelegt')}
const cv=v.canvas;cv.addEventListener('pointerdown',e=>{if(e.button!==0||s.map)return;drag=true;lastX=e.clientX;lastY=e.clientY;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag||s.map)return;camYaw-=(e.clientX-lastX)*.28;camPitch=Math.max(-65,Math.min(-3,camPitch+(e.clientY-lastY)*.2));lastX=e.clientX;lastY=e.clientY});cv.addEventListener('pointerup',e=>{drag=false;try{cv.releasePointerCapture(e.pointerId)}catch(_){}});cv.addEventListener('wheel',e=>{if(s.map)return;e.preventDefault();camDist=Math.max(18,Math.min(150,camDist+e.deltaY*.06))},{passive:false});function center(){camYaw=0;camPitch=-16;camDist=45;toast('Kamera zentriert')}$('center').onclick=center;
const seaNames=['glatt','ruhig','leicht','mäßig','rau','schwer'];$('sea').oninput=e=>{s.sea=+e.target.value;$('seaTxt').textContent=s.sea+' · '+seaNames[s.sea];if(waterMat){waterMat.uniforms.amplitude=2.5+s.sea*2.2;waterMat.uniforms.frequency=700-s.sea*70;waterMat.uniforms.animationSpeed=.010+s.sea*.004}}
let mw=$('mwrap'),mc=$('map'),ctx=mc.getContext('2d'),z=15,cen={lat:START.lat,lon:START.lon},cache=new Map();function X(l,z){return(l+180)/360*2**z}function Y(a,z){let r=a*Math.PI/180;return(1-Math.asinh(Math.tan(r))/Math.PI)/2*2**z}function L(x,z){return x/2**z*360-180}function A(y,z){let n=Math.PI-2*Math.PI*y/2**z;return 180/Math.PI*Math.atan(Math.sinh(n))}function tile(u,k){if(cache.has(k))return cache.get(k);let im=new Image(),r={im,ok:false};cache.set(k,r);im.onload=()=>{r.ok=true;drawMap()};im.src=u;return r}function layer(base,z,cx,cy,w,h){for(let j=-4;j<=4;j++)for(let i=-6;i<=6;i++){let tx=Math.floor(cx)+i,ty=Math.floor(cy)+j,n=2**z;if(ty<0||ty>=n)continue;tx=(tx%n+n)%n;let px=w/2+(Math.floor(cx)+i-cx)*256,py=h/2+(Math.floor(cy)+j-cy)*256,u=base.replace('{z}',z).replace('{x}',tx).replace('{y}',ty),r=tile(u,base+z+'/'+tx+'/'+ty);if(r.ok)ctx.drawImage(r.im,px,py,256,256)}}function resizeMap(){let d=Math.min(devicePixelRatio||1,2),r=mc.getBoundingClientRect();mc.width=r.width*d;mc.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);drawMap()}function drawMap(){if(!s.map)return;let r=mc.getBoundingClientRect(),w=r.width,h=r.height,cx=X(cen.lon,z),cy=Y(cen.lat,z);ctx.fillStyle='#bdd3dc';ctx.fillRect(0,0,w,h);layer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',z,cx,cy,w,h);layer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',z,cx,cy,w,h);let bx=(X(s.lon,z)-cx)*256+w/2,by=(Y(s.lat,z)-cy)*256+h/2;ctx.fillStyle='#ffe65f';ctx.beginPath();ctx.arc(bx,by,7,0,Math.PI*2);ctx.fill()}function tm(){s.map=!s.map;mw.style.display=s.map?'block':'none';if(s.map){cen={lat:s.lat,lon:s.lon};setTimeout(resizeMap,0)}}mc.addEventListener('contextmenu',e=>{e.preventDefault();let r=mc.getBoundingClientRect(),cx=X(cen.lon,z),cy=Y(cen.lat,z),tx=cx+(e.clientX-r.left-r.width/2)/256,ty=cy+(e.clientY-r.top-r.height/2)/256;s.lon=L(tx,z);s.lat=A(ty,z);s.speed=0;s.thr=0;s.dock=false;cen={lat:s.lat,lon:s.lon};drawMap();toast('Teleportiert')});mc.addEventListener('wheel',e=>{e.preventDefault();z=Math.max(4,Math.min(18,z+(e.deltaY<0?1:-1)));drawMap()},{passive:false});
addEventListener('keydown',e=>{if(['KeyW','KeyA','KeyS','KeyD'].includes(e.code)){keys.add(e.code);e.preventDefault()}if(e.code==='KeyG'&&!e.repeat)dock();if(e.code==='KeyM'&&!e.repeat)tm();if(e.code==='KeyC'&&!e.repeat)center()});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('resize',()=>s.map&&resizeMap());let last=performance.now();v.scene.preRender.addEventListener(()=>{let n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;phy(dt,n/1000);cam();hud()});center();
})();
</script></body></html>
