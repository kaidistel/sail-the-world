<!doctype html>
<html lang="de">
<head>

<title>Sail the World</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.118/Build/Cesium/Widgets/widgets.css">
<style>
*{box-sizing:border-box}html,body,#c{width:100%;height:100%;margin:0;overflow:hidden;background:#6fa9c9;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.cesium-viewer-bottom,.cesium-viewer-toolbar{display:none!important}
#hud{position:fixed;z-index:20;top:14px;left:14px;color:#fff;text-shadow:0 2px 8px #000;pointer-events:none}#hud h3{margin:0 0 8px;letter-spacing:.1em}.stats{display:flex;gap:6px}.card{background:#071625dc;border:1px solid #ffffff28;border-radius:9px;padding:8px 10px;min-width:86px;backdrop-filter:blur(7px)}.card strong{display:block;font-size:18px}.card small{font-size:8px;opacity:.7}.help{margin-top:7px;background:#071625c8;border:1px solid #ffffff1c;border-radius:8px;padding:7px 9px;font-size:11px}
#st{position:fixed;z-index:21;top:14px;right:14px;color:#fff;background:#071625dd;border:1px solid #ffffff28;border-radius:9px;padding:8px 10px;font-size:10px}#look{position:fixed;z-index:22;right:14px;bottom:14px;color:#fff;background:#071625d8;border:1px solid #ffffff22;border-radius:9px;padding:7px 10px;font-size:10px;pointer-events:none}
#mwrap{position:fixed;inset:0;z-index:40;background:#08131d;display:none}#mh{height:50px;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:900}#map{position:absolute;top:50px;bottom:0;width:100%;height:calc(100% - 50px);background:#bed5dc;cursor:crosshair}#toast{position:fixed;z-index:60;left:50%;bottom:22px;transform:translateX(-50%);background:#071625ed;color:#fff;border-radius:20px;padding:8px 13px;opacity:0;transition:.2s}#toast.on{opacity:1}
</style></head>
<body>
<div id="c"></div>
<div id="hud"><h3>SAIL THE WORLD · NASSAUHAFEN</h3><div class="stats"><div class="card"><strong id="sp">0.0</strong><small>KNOTEN</small></div><div class="card"><strong id="hd">190</strong><small>KURS</small></div><div class="card"><strong id="th">0</strong><small>MASCHINE %</small></div><div class="card"><strong id="ro">0.0°</strong><small>ROLL</small></div></div><div class="help">W/S Gas · A/D Lenken · G Anlegen · M OpenSeaMap · Maus ziehen = umsehen · Mausrad = Zoom · C = Kamera zentrieren</div></div>
<div id="st">Lade ArcGIS …</div><div id="look">32-kn Katamaran · freie Kamera</div>
<div id="mwrap"><div id="mh">OPEN<span style="color:#5cc9ff">SEA</span>MAP <span style="font-size:10px;font-weight:500">M schließen · Rechtsklick teleportiert</span></div><canvas id="map"></canvas></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.118/Build/Cesium/Cesium.js"></script>
<script>
(async()=>{
const START={lat:53.513611,lon:8.151944,heading:190},KN=.514444,MAX=32;
const s={...START,speed:0,thr:0,rud:0,yaw:0,roll:0,pitch:0,heave:0,map:false,dock:false};
const keys=new Set(),$=x=>document.getElementById(x);let camYaw=0,camPitch=-15,camDist=42,drag=false,lastX=0,lastY=0;
function toast(t){$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('on'),1400)}
let v=new Cesium.Viewer('c',{baseLayer:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),animation:false,timeline:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,geocoder:false,baseLayerPicker:false,fullscreenButton:false,infoBox:false,selectionIndicator:false});
v.scene.skyBox=undefined;v.scene.backgroundColor=new Cesium.Color(.47,.70,.84,1);v.scene.globe.baseColor=new Cesium.Color(.18,.34,.23,1);v.scene.globe.depthTestAgainstTerrain=true;v.scene.fog.enabled=true;v.scene.fog.density=.000055;v.scene.highDynamicRange=true;
v.scene.screenSpaceCameraController.enableRotate=false;v.scene.screenSpaceCameraController.enableTranslate=false;v.scene.screenSpaceCameraController.enableZoom=false;v.scene.screenSpaceCameraController.enableTilt=false;v.scene.screenSpaceCameraController.enableLook=false;
try{let im=await Cesium.ArcGisMapServerImageryProvider.fromUrl('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer');v.imageryLayers.addImageryProvider(im);$('st').textContent='ArcGIS Bild ✓'}catch(e){$('st').textContent='ArcGIS Bild blockiert'}
try{v.terrainProvider=await Cesium.ArcGISTiledElevationTerrainProvider.fromUrl('https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer');$('st').textContent+=' · Terrain ✓'}catch(e){$('st').textContent+=' · Terrain Fallback'}
// SEA: solid fallback plus animated normal-map surface
v.entities.add({rectangle:{coordinates:Cesium.Rectangle.fromDegrees(3,50.5,10.7,57.8),height:.05,material:new Cesium.Color(.012,.22,.31,1)}});
try{let mat=new Cesium.Material({fabric:{type:'Water',uniforms:{normalMap:Cesium.buildModuleUrl('Assets/Textures/waterNormals.jpg'),frequency:310,animationSpeed:.032,amplitude:11,specularIntensity:1.25,fadeFactor:1,baseWaterColor:new Cesium.Color(.008,.14,.20,.96),blendColor:new Cesium.Color(.015,.40,.50,.80)}}});v.scene.primitives.add(new Cesium.Primitive({geometryInstances:new Cesium.GeometryInstance({geometry:new Cesium.RectangleGeometry({rectangle:Cesium.Rectangle.fromDegrees(3,50.5,10.7,57.8),height:.16,vertexFormat:Cesium.EllipsoidSurfaceAppearance.VERTEX_FORMAT})}),appearance:new Cesium.EllipsoidSurfaceAppearance({aboveGround:true,material:mat})}))}catch(e){}
function off(f,r){let a=s.heading*Math.PI/180,n=f*Math.cos(a)-r*Math.sin(a),e=f*Math.sin(a)+r*Math.cos(a);return{lat:s.lat+n/111320,lon:s.lon+e/(111320*Math.cos(s.lat*Math.PI/180))}}
function pos(f,r,u){let p=off(f,r);return Cesium.Cartesian3.fromDegrees(p.lon,p.lat,.9+s.heave+u)}
function ori(){return Cesium.Transforms.headingPitchRollQuaternion(Cesium.Cartesian3.fromDegrees(s.lon,s.lat,.9+s.heave),new Cesium.HeadingPitchRoll(Cesium.Math.toRadians(s.heading),Cesium.Math.toRadians(s.pitch),Cesium.Math.toRadians(s.roll)))}
function add(f,r,u,o){v.entities.add({position:new Cesium.CallbackProperty(()=>pos(f,r,u),false),orientation:new Cesium.CallbackProperty(()=>ori(),false),...o})}
// 13 m sport catamaran: two hulls, bridge deck, cabin, hardtop, twin outboards
const WHITE=new Cesium.Color(.96,.97,.97,1),NAVY=new Cesium.Color(.025,.14,.25,1),GLASS=new Cesium.Color(.025,.12,.17,.92),GREY=new Cesium.Color(.18,.20,.21,1),WOOD=new Cesium.Color(.62,.48,.29,1);
add(.2,-2.05,-.05,{ellipsoid:{radii:new Cesium.Cartesian3(6.55,1.02,.92),material:WHITE}});add(.2,2.05,-.05,{ellipsoid:{radii:new Cesium.Cartesian3(6.55,1.02,.92),material:WHITE}});
add(-.15,-2.05,-.68,{box:{dimensions:new Cesium.Cartesian3(10.7,2.0,.30),material:NAVY}});add(-.15,2.05,-.68,{box:{dimensions:new Cesium.Cartesian3(10.7,2.0,.30),material:NAVY}});
add(-.2,0,.78,{box:{dimensions:new Cesium.Cartesian3(8.8,4.9,.42),material:WHITE}});add(-.3,0,1.75,{box:{dimensions:new Cesium.Cartesian3(4.8,4.15,1.55),material:WHITE}});
add(1.55,0,2.0,{box:{dimensions:new Cesium.Cartesian3(1.55,4.18,1.22),material:new Cesium.Color(.72,.84,.89,1)}});add(1.95,-1.55,2.0,{box:{dimensions:new Cesium.Cartesian3(1.1,.14,.72),material:GLASS}});add(1.95,1.55,2.0,{box:{dimensions:new Cesium.Cartesian3(1.1,.14,.72),material:GLASS}});
add(-.4,0,3.08,{box:{dimensions:new Cesium.Cartesian3(5.1,4.35,.22),material:WHITE}});add(-.6,0,2.55,{cylinder:{length:1.0,topRadius:.08,bottomRadius:.08,material:GREY}});add(-.6,0,3.65,{box:{dimensions:new Cesium.Cartesian3(2.5,.12,.12),material:GREY}});
add(-4.7,0,.98,{box:{dimensions:new Cesium.Cartesian3(2.3,4.6,.22),material:WOOD}});
add(-6.05,-1.55,-.05,{box:{dimensions:new Cesium.Cartesian3(1.0,.82,1.28),material:GREY}});add(-6.05,1.55,-.05,{box:{dimensions:new Cesium.Cartesian3(1.0,.82,1.28),material:GREY}});
add(-6.45,-1.55,-.62,{cylinder:{length:.82,topRadius:.23,bottomRadius:.23,material:new Cesium.Color(.07,.07,.08,1)}});add(-6.45,1.55,-.62,{cylinder:{length:.82,topRadius:.23,bottomRadius:.23,material:new Cesium.Color(.07,.07,.08,1)}});
// physical waves used by boat and visible wave crest field
const waves=[{a:.48,l:30,d:18,w:1.35},{a:.31,l:15,d:58,w:1.9},{a:.17,l:7.2,d:123,w:2.6},{a:.08,l:3.3,d:205,w:3.3}];
function lm(){return{x:(s.lon-START.lon)*111320*Math.cos(START.lat*Math.PI/180),y:(s.lat-START.lat)*111320}}
function wh(x,y,t){let h=0;for(let q of waves){let k=2*Math.PI/q.l,d=q.d*Math.PI/180;h+=q.a*Math.sin(k*(x*Math.sin(d)+y*Math.cos(d))-q.w*t)}return h}
function worldPoint(f,r,h){let p=off(f,r);return Cesium.Cartesian3.fromDegrees(p.lon,p.lat,.18+h)}
const crestLines=[];for(let li=-8;li<=8;li++){let line=v.entities.add({polyline:{positions:new Cesium.CallbackProperty(()=>{let t=performance.now()/1000,arr=[];for(let j=-10;j<=10;j++){let f=li*10,jr=j*8,base=lm(),a=s.heading*Math.PI/180,fx=Math.sin(a),fy=Math.cos(a),rx=Math.cos(a),ry=-Math.sin(a),h=wh(base.x+fx*f+rx*jr,base.y+fy*f+ry*jr,t);arr.push(worldPoint(f,jr,h*.58))}return arr},false),width:1.25,material:new Cesium.Color(.70,.91,1,.22)}});crestLines.push(line)}
// whitecaps and wake
const caps=[];for(let i=0;i<34;i++){let e=v.entities.add({position:new Cesium.CallbackProperty(()=>{let t=performance.now()/1000,a=(i*2.31+t*.08),f=Math.cos(a)*(35+(i%9)*9),r=Math.sin(a)*(32+(i%7)*8),p=off(f,r),base=lm(),hd=wh(base.x+f,base.y+r,t);return Cesium.Cartesian3.fromDegrees(p.lon,p.lat,.28+Math.max(0,hd*.45))},false),ellipse:{semiMajorAxis:1.5+(i%5)*.5,semiMinorAxis:.18+(i%3)*.12,height:.3,material:new Cesium.Color(1,1,1,.09)}});caps.push(e)}
const wake=[];for(let i=0;i<26;i++){let e=v.entities.add({position:new Cesium.CallbackProperty(()=>{let age=(performance.now()/1000+i*.19)%5.8,f=-5-age*(2.8+Math.abs(s.speed)*.85),r=(i%2?1:-1)*(1.4+age*.72);let p=off(f,r);return Cesium.Cartesian3.fromDegrees(p.lon,p.lat,.28)},false),ellipse:{semiMajorAxis:2.1+(i%4)*.65,semiMinorAxis:.28+(i%3)*.15,height:.29,material:new Cesium.Color(1,1,1,0)}});wake.push(e)}
function phy(dt,t){if(s.map)return;if(s.dock){s.speed*=Math.exp(-10*dt);return}
 if(keys.has('KeyW'))s.thr=Math.min(1,s.thr+dt*.62);if(keys.has('KeyS'))s.thr=Math.max(-.32,s.thr-dt*.75);
 let ri=(keys.has('KeyA')?-1:0)+(keys.has('KeyD')?1:0);s.rud+=(ri-s.rud)*Math.min(1,dt*7.5);
 let target=s.thr>=0?s.thr*MAX*KN:s.thr*8.5;s.speed+=(target-s.speed)*Math.min(1,dt/(target>s.speed?2.7:4.0));
 let auth=Math.min(1,Math.abs(s.speed)/(1.8*KN)),ty=s.rud*auth*(7.0*Math.PI/180);s.yaw+=(ty-s.yaw)*Math.min(1,dt/0.72);s.heading=(s.heading+s.yaw*180/Math.PI*dt+360)%360;
 let a=s.heading*Math.PI/180;s.lat+=Math.cos(a)*s.speed*dt/111320;s.lon+=Math.sin(a)*s.speed*dt/(111320*Math.cos(s.lat*Math.PI/180));
 let p=lm(),fx=Math.sin(a),fy=Math.cos(a),rx=Math.cos(a),ry=-Math.sin(a),sample=(f,r)=>wh(p.x+fx*f+rx*r,p.y+fy*f+ry*r,t),bow=sample(5.2,0),stern=sample(-5.2,0),port=sample(0,-2.05),star=sample(0,2.05),mid=sample(0,0);
 s.heave+=(mid-s.heave)*Math.min(1,dt*3.1);let pt=Math.atan2(bow-stern,10.4)*180/Math.PI,rt=Math.atan2(star-port,4.1)*180/Math.PI-s.rud*Math.min(1,Math.abs(s.speed)/(12*KN))*8.5;s.pitch+=(pt-s.pitch)*Math.min(1,dt*2.5);s.roll+=(Math.max(-16,Math.min(16,rt))-s.roll)*Math.min(1,dt*2.35)}
function cam(){if(s.map)return;let worldYaw=(s.heading+180+camYaw)*Math.PI/180,flat=camDist*Math.cos(camPitch*Math.PI/180),height=6+camDist*Math.sin(-camPitch*Math.PI/180),north=Math.cos(worldYaw)*flat,east=Math.sin(worldYaw)*flat,lat=s.lat+north/111320,lon=s.lon+east/(111320*Math.cos(s.lat*Math.PI/180));let dest=Cesium.Cartesian3.fromDegrees(lon,lat,height+s.heave),target=Cesium.Cartesian3.fromDegrees(s.lon,s.lat,1.5+s.heave),dir=Cesium.Cartesian3.normalize(Cesium.Cartesian3.subtract(target,dest,new Cesium.Cartesian3()),new Cesium.Cartesian3()),up=Cesium.Ellipsoid.WGS84.geodeticSurfaceNormal(dest,new Cesium.Cartesian3());v.camera.setView({destination:dest,orientation:{direction:dir,up}})}
function hud(){$('sp').textContent=(Math.abs(s.speed)/KN).toFixed(1);$('hd').textContent=String(Math.round(s.heading)).padStart(3,'0');$('th').textContent=Math.round(s.thr*100);$('ro').textContent=s.roll.toFixed(1)+'°';let alpha=Math.min(.55,Math.abs(s.speed)/(MAX*KN)*.55);wake.forEach((e,i)=>e.ellipse.material=new Cesium.Color(1,1,1,alpha*(.55+(i%3)*.15)))}
function dock(){let p=lm();if(s.dock){s.dock=false;toast('Abgelegt');return}if(Math.hypot(p.x,p.y)>110)return toast('Kein Anleger in Reichweite');if(Math.abs(s.speed)/KN>4)return toast('Unter 4 kn abbremsen');Object.assign(s,{lat:START.lat,lon:START.lon,heading:190,speed:0,thr:0,rud:0,yaw:0,dock:true});toast('Angelegt')}
// free mouse camera
const canvas=v.canvas;canvas.addEventListener('pointerdown',e=>{if(e.button!==0||s.map)return;drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag||s.map)return;camYaw-=(e.clientX-lastX)*.32;camPitch=Math.max(-65,Math.min(-3,camPitch+(e.clientY-lastY)*.22));lastX=e.clientX;lastY=e.clientY});canvas.addEventListener('pointerup',e=>{drag=false;try{canvas.releasePointerCapture(e.pointerId)}catch(_){}});canvas.addEventListener('wheel',e=>{if(s.map)return;e.preventDefault();camDist=Math.max(18,Math.min(135,camDist+e.deltaY*.055))},{passive:false});
// OpenSeaMap
let mw=$('mwrap'),mc=$('map'),x=mc.getContext('2d'),z=15,cen={lat:START.lat,lon:START.lon},cache=new Map();function lx(l,z){return(l+180)/360*2**z}function ly(a,z){let r=a*Math.PI/180;return(1-Math.asinh(Math.tan(r))/Math.PI)/2*2**z}function xl(q,z){return q/2**z*360-180}function yl(q,z){let n=Math.PI-2*Math.PI*q/2**z;return 180/Math.PI*Math.atan(Math.sinh(n))}function ti(u,k){if(cache.has(k))return cache.get(k);let i=new Image(),r={i,ok:false};cache.set(k,r);i.onload=()=>{r.ok=true;dm()};i.src=u;return r}function layer(base,z,cx,cy,w,h){for(let j=-4;j<=4;j++)for(let i=-6;i<=6;i++){let tx=Math.floor(cx)+i,ty=Math.floor(cy)+j,n=2**z;if(ty<0||ty>=n)continue;tx=(tx%n+n)%n;let px=w/2+(Math.floor(cx)+i-cx)*256,py=h/2+(Math.floor(cy)+j-cy)*256,u=base.replace('{z}',z).replace('{x}',tx).replace('{y}',ty),r=ti(u,base+z+'/'+tx+'/'+ty);if(r.ok)x.drawImage(r.i,px,py,256,256)}}function rm(){let d=Math.min(devicePixelRatio||1,2),r=mc.getBoundingClientRect();mc.width=r.width*d;mc.height=r.height*d;x.setTransform(d,0,0,d,0,0);dm()}function dm(){if(!s.map)return;let r=mc.getBoundingClientRect(),w=r.width,h=r.height,cx=lx(cen.lon,z),cy=ly(cen.lat,z);x.fillStyle='#bdd3dc';x.fillRect(0,0,w,h);layer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',z,cx,cy,w,h);layer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',z,cx,cy,w,h);let bx=(lx(s.lon,z)-cx)*256+w/2,by=(ly(s.lat,z)-cy)*256+h/2;x.fillStyle='#ffe65f';x.beginPath();x.arc(bx,by,7,0,Math.PI*2);x.fill()}function tm(){s.map=!s.map;mw.style.display=s.map?'block':'none';if(s.map){cen={lat:s.lat,lon:s.lon};setTimeout(rm,0)}}mc.addEventListener('contextmenu',e=>{e.preventDefault();let r=mc.getBoundingClientRect(),cx=lx(cen.lon,z),cy=ly(cen.lat,z),tx=cx+(e.clientX-r.left-r.width/2)/256,ty=cy+(e.clientY-r.top-r.height/2)/256;s.lon=xl(tx,z);s.lat=yl(ty,z);s.speed=0;s.thr=0;s.dock=false;cen={lat:s.lat,lon:s.lon};dm();toast('Teleportiert')});mc.addEventListener('wheel',e=>{e.preventDefault();z=Math.max(4,Math.min(18,z+(e.deltaY<0?1:-1)));dm()},{passive:false});
addEventListener('keydown',e=>{if(['KeyW','KeyA','KeyS','KeyD'].includes(e.code)){keys.add(e.code);e.preventDefault()}if(e.code==='KeyG'&&!e.repeat)dock();if(e.code==='KeyM'&&!e.repeat)tm();if(e.code==='KeyC'&&!e.repeat){camYaw=0;camPitch=-15;camDist=42;toast('Kamera zentriert')}});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('resize',()=>s.map&&rm());let last=performance.now();v.scene.preRender.addEventListener(()=>{let n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;phy(dt,n/1000);cam();hud()});cam();
})();
</script></body></html>
